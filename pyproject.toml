[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoapply"
version = "0.1.0"
description = "Self-hosted AI job application agent: find, tailor, apply, track."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "httpx>=0.27", "typer>=0.12",
  "pyyaml>=6", "anthropic>=0.40", "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autoapply = "autoapply.cli:app"

[tool.setuptools.packages.find]
include = ["autoapply*"]

[tool.setuptools.package-data]
autoapply = ["web/*.html", "*.yaml"]
