<!doctype html><html><body>
<!-- Structures copied from live forms (Nov 2026): Ashby, Lever, Greenhouse. -->
<div class="ashby-application-form-autofill-pane"><input type="file" id="autofill"><label for="autofill">Autofill from resume</label></div>
<div class="ashby-application-form-container">
  <div class="field-entry"><label class="_heading _required ashby-application-form-question-title" for="rs">Resume</label>
    <div><input type="file" id="rs"><button>Upload File</button></div></div>
  <div class="field-entry"><label class="_heading _required ashby-application-form-question-title">Do you have 7 years of experience?</label>
    <div class="yesno"><button type="button">Yes</button><button type="button">No</button></div></div>
  <div class="field-entry"><label class="_heading ashby-application-form-question-title">Open to relocation?</label>
    <div class="yesno"><button type="button">Yes</button><button type="button">No</button></div></div>

  <label><div class="application-label">Resume/CV <span>✱</span></div><div><span>ATTACH RESUME/CV</span><input type="file" id="lv"></div></label>
  <label><div class="application-label">Full name<span>✱</span></div><input type="text" name="name"></label>
  <div><div class="application-label">Are you authorized to work? <span>✱</span></div>
    <label><input type="radio" name="auth" value="Yes">Yes</label><label><input type="radio" name="auth" value="No">No</label></div>

  <div role="group" aria-labelledby="upload-label-resume"><div id="upload-label-resume">Cover Letter</div>
    <label for="gh">Attach</label><input type="file" id="gh"></div>
</div>
</body></html>
