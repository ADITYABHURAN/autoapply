<!doctype html>
<html><head><meta charset="utf-8"><title>Apply - ML Engineer</title>
<style>.sr{position:absolute;opacity:0;width:1px;height:1px}.menu{border:1px solid #999}.hide{display:none}</style></head>
<body>
<h1>ML Engineer</h1>
<form id="application-form">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" type="text" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" type="text" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" type="file" class="sr" accept=".pdf" required></div>
  <div class="field"><label for="li">LinkedIn Profile</label><input id="li" type="text"></div>

  <div class="field"><label for="auth">Are you legally authorized to work in the United States? *</label>
    <select id="auth" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select></div>

  <fieldset><legend>Will you now or in the future require sponsorship for employment visa status? *</legend>
    <label><input type="radio" name="spons" value="y" class="sr"> Yes</label>
    <label><input type="radio" name="spons" value="n" class="sr"> No</label></fieldset>

  <div class="field"><label id="gl">Gender</label>
    <input id="gender" role="combobox" aria-labelledby="gl" autocomplete="off">
    <div id="gmenu" class="menu hide">
      <div role="option">Male</div><div role="option">Female</div><div role="option">Decline To Self Identify</div></div></div>

  <div class="question"><div class="question-title">Are you willing to relocate? *</div>
    <div class="btns"><button type="button" class="yn">Yes</button><button type="button" class="yn">No</button></div>
    <input type="hidden" id="reloc"></div>

  <div class="field"><label for="why">Why do you want to work here?</label><textarea id="why"></textarea></div>

  <div id="followup" class="field hide"><label for="visa">What is your current visa status?</label><input id="visa" type="text"></div>

  <label><input type="checkbox" id="consent" required> I agree to the privacy policy *</label>
  <button type="submit">Submit application</button>
</form>
<div id="done" class="hide"><h2>Thank you for applying.</h2><pre id="dump"></pre></div>
<script>
  const g = document.getElementById('gender'), m = document.getElementById('gmenu');
  g.addEventListener('click', () => m.classList.remove('hide'));
  g.addEventListener('input', () => { m.classList.remove('hide');
    m.querySelectorAll('[role=option]').forEach(o => o.style.display = o.textContent.toLowerCase().includes(g.value.toLowerCase()) ? '' : 'none'); });
  g.addEventListener('keydown', e => { if (e.key === 'Escape') m.classList.add('hide'); });
  m.querySelectorAll('[role=option]').forEach(o => o.addEventListener('click', () => { g.value = o.textContent; m.classList.add('hide'); }));
  document.querySelectorAll('.yn').forEach(b => b.addEventListener('click', () => document.getElementById('reloc').value = b.textContent));
  document.querySelectorAll('input[name=spons]').forEach(r => r.addEventListener('change', () =>
    document.getElementById('followup').classList.toggle('hide', r.value !== 'y' || !r.checked)));
  document.getElementById('application-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value;
    document.getElementById('dump').textContent = JSON.stringify({
      first: v('first_name'), last: v('last_name'), email: v('email'), phone: v('phone'), linkedin: v('li'),
      resume: (document.getElementById('resume').files[0] || {}).name || '', auth: v('auth'),
      spons: (document.querySelector('input[name=spons]:checked') || {}).value || '', gender: v('gender'),
      reloc: v('reloc'), why: v('why'), visa: v('visa'), consent: document.getElementById('consent').checked });
    e.target.classList.add('hide'); document.getElementById('done').classList.remove('hide');
  });
</script>
</body></html>
